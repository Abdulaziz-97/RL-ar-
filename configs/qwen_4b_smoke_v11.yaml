# Recommended recipe for Vast.ai NVIDIA A40 48GB GPU.
# Model: Qwen3.5-4B. Soft length, ungated language, partial format shaping.

model_name: "Qwen/Qwen3.5-4B"
load_in_4bit: false
bnb_4bit_compute_dtype: "bfloat16"
bnb_4bit_quant_type: "nf4"
bnb_4bit_use_double_quant: true

lora_r: 128
lora_alpha: 256
lora_dropout: 0.05

train_data_path: "data/arabic_reasoning_rlvr_train.jsonl"
eval_data_path: "data/arabic_reasoning_rlvr_eval.jsonl"
coldstart_data_path: "data/arabic_reasoning_coldstart_train.jsonl"

num_generations: 16
max_completion_length: 512
temperature: 1.35
top_p: 0.95
top_k: 40
stop_strings: ["</answer>"]

learning_rate: 3.0e-6
num_train_epochs: 2
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
max_grad_norm: 1.0
warmup_ratio: 0.1
lr_scheduler_type: "cosine"
optim: "adamw_torch"
seed: 42

loss_type: "dr_grpo"
scale_rewards: "batch"
beta: 0.0
epsilon: 0.2
epsilon_high: 0.28
importance_sampling_level: "token"
mask_truncated_completions: true

# Weights: [correctness, format, language, answer_leak, structural_leak, length]
reward_weights: [0.45, 0.35, 0.10, 0.5, 0.3, 0.02]

enable_stability_callback: true
stability_consecutive: 2
entropy_collapse_action: "warn"
entropy_lr_reduction_factor: 0.5
enable_adaptive_beta: false
kl_near_zero_threshold: 0.001
stuck_beta: 0.0
enable_adaptive_temperature: true
entropy_target_min: 1.5
temp_bump: 0.15
temp_max: 1.5
temp_bump_cooldown_steps: 3
early_diag_steps: 30

output_dir: "./outputs"
logging_steps: 10
save_steps: 500
bf16: true
fp16: false
gradient_checkpointing: true
use_transformers_continuous_batching: false
use_wandb: false
wandb_project: "arabic-reasoning-rlvr"

zero_variance_strategy: "direct_scoring"

curriculum_schedule_type: "gaussian"
sigma_fraction: 0.2

enable_crps: true
crps_max_age_steps: 100
crps_max_traces: 256

log_completions: false
num_completions_to_print: 4
