# Production recipe for 2x NVIDIA RTX 5090 (2 x 32GB = 64GB VRAM)
# Model: Qwen3.5-4B (1,707 Verified SFT + RLVR Samples)

model_name: "Qwen/Qwen3.5-4B"
load_in_4bit: false
bnb_4bit_compute_dtype: "bfloat16"

# LoRA Configuration
lora_r: 128
lora_alpha: 256
lora_dropout: 0.05

# Dataset Paths (1,707 Verified Samples)
train_data_path: "data/arabic_reasoning_rlvr_train.jsonl"
eval_data_path: "data/arabic_reasoning_rlvr_eval.jsonl"
coldstart_data_path: "data/arabic_reasoning_coldstart_train.jsonl"

# GRPO Generation Hyperparameters
num_generations: 16             # 16 rollouts per prompt (Restores G=16 advantage resolution!)
max_completion_length: 768       # Arabic CoT reasoning — 768 tokens required (Unlocked 75.20% AraIFEval)
temperature: 1.0                # Base training temperature = 1.0 (Clean rollout sampling)
top_p: 0.95
top_k: 40
stop_strings: ["</answer>"]

# Multi-GPU Hyperparameters (2x RTX 5090 PyTorch DDP)
learning_rate: 5.0e-6
num_train_epochs: 1              # 1 full epoch over 1,707 samples (prevents overfitting)
per_device_train_batch_size: 2   # 2 prompts/GPU x 16 rollouts = 32 completions/GPU (~22.0GB VRAM per GPU, 10GB safety buffer)
gradient_accumulation_steps: 4   # 4 micro-steps = generation_batch_size 16 (divisible by num_generations=16)
max_grad_norm: 1.0
warmup_ratio: 0.1
lr_scheduler_type: "cosine"
optim: "adamw_torch"
seed: 42

# Loss & Stability Controls
loss_type: "dr_grpo"
scale_rewards: "batch"
beta: 0.04
epsilon: 0.2
epsilon_high: 0.28
importance_sampling_level: "token"
mask_truncated_completions: true

# Multi-Reward Weights: [correctness, format, language, answer_leak, structural_leak, length]
# Correctness set to 0.80 — mathematical correctness dominates policy gradients
reward_weights: [0.8, 0.2, 0.05, 0.5, 0.3, 0.0]
# GDPO: Normalize each reward independently before weighted sum (NVlabs arXiv:2601.05242)
gdpo_decoupled_normalization: true

# Adaptive Entropy Regularization (prevents entropy collapse — TRL native)
entropy_coef: 0.01
use_adaptive_entropy: true
entropy_target: 2.0
entropy_coef_delta: 0.005

# Adaptive Controls & Stability
enable_stability_callback: true
stability_consecutive: 2
entropy_collapse_action: "warn"
entropy_lr_reduction_factor: 0.5
enable_adaptive_temperature: true
entropy_target_min: 1.5
temp_bump: 0.10
temp_max: 1.25                   # Adaptive temperature capped at 1.25
temp_bump_cooldown_steps: 3
early_diag_steps: 30

# Infrastructure Settings
output_dir: "./outputs/qwen_4b_2x5090_run"
logging_steps: 10
save_steps: 200
bf16: true
fp16: false
gradient_checkpointing: true

# Live Completion Printing & Telemetry
log_completions: false
num_completions_to_print: 0
use_vllm: false
use_wandb: false
wandb_project: "arabic-reasoning-rlvr"

zero_variance_strategy: "direct_scoring"
curriculum_schedule_type: "gaussian"
sigma_fraction: 0.2
enable_crps: true
crps_max_age_steps: 100
crps_max_traces: 256
