# GRPO_V4 — Production Hardened Config for 2x NVIDIA RTX 5090 (32GB VRAM per GPU)
# Fresh-run baseline: SFT-anchored GRPO with beta>0, no embed LoRA, no mid-train probe.

model_name: "Qwen/Qwen3.5-4B"
instruction_base_model: "aziz9788/T06__qwen35-mixed-v6-lr1e5"
load_in_4bit: false
bnb_4bit_compute_dtype: "bfloat16"

# High-Capacity LoRA Expansion (r=128, alpha=256) — linear modules only
lora_r: 128
lora_alpha: 256
lora_dropout: 0.05
# Do NOT target embed_tokens/lm_head: PEFT forces save_embedding_layers=True
# (master_execution_v4.log: embedding save at step 200 → process Killed at 201).
lora_target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# Dataset: MASTER V5 DATASETS (4,000 SFT + 4,000 RLVR Prompts)
train_data_path: "data/arabic_reasoning_rlvr_v5.jsonl"
eval_data_path: "data/arabic_reasoning_rlvr_eval.jsonl"
coldstart_data_path: "data/arabic_reasoning_coldstart_v5.jsonl"

# Stage-separated SFT budget (must NOT inherit GRPO max_steps)
sft_num_train_epochs: 1.0
sft_max_steps: null
sft_per_device_train_batch_size: 4
sft_gradient_accumulation_steps: 1
sft_learning_rate: 1.0e-4

# GRPO Generation Hyperparameters
num_generations: 16
max_completion_length: 2048
temperature: 1.15
top_p: 0.95
top_k: 40
stop_strings: ["</answer>"]

# ── PROVEN V3 BATCH MATH (2 Prompts per GPU) ───────────────────────────
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
num_train_epochs: 2
max_steps: 250

learning_rate: 2.0e-6
ddp_find_unused_parameters: false
max_grad_norm: 1.0
warmup_ratio: 0.1
lr_scheduler_type: "cosine"
optim: "adamw_torch"
seed: 42

# Memory Optimization Flags
gradient_checkpointing: true
bf16: true
fp16: false
attn_implementation: "sdpa"

# GRPO Loss — SFT-anchored baseline (beta>0); zero-KL is a later ablation
loss_type: "dr_grpo"
scale_rewards: "batch"
beta: 0.02
epsilon: 0.2
epsilon_high: 0.28
importance_sampling_level: "token"
mask_truncated_completions: true

# Multi-Reward Weights: [correctness, format, language, answer_leak, structural_leak, length]
# Length weight stays 0 until calibrated to real CoT lengths.
reward_weights: [0.85, 0.10, 0.05, 0.5, 0.3, 0.0]
gdpo_decoupled_normalization: true

# Entropy Collapse Prevention
# Installed TRL GRPOConfig has no entropy_coef / use_adaptive_entropy.
# Non-zero values used to be silently dropped — validate() fails closed if
# these are re-enabled without TRL support. Do NOT invent fake adaptive entropy.
entropy_coef: 0
use_adaptive_entropy: false
# entropy_target: 3.0
# entropy_coef_delta: 0.01
# Beyond-80/20 Rule (TRL top_entropy_quantile / paper ρ): keep only top-ρ
# entropy tokens in the policy loss. NOT a substitute for entropy_coef /
# use_adaptive_entropy. Paper recommends 0.2; 1.0 = keep all tokens.
top_entropy_quantile: 0.2

# Stability Callbacks — current entropy-collapse alternative (reduce_lr).
# Adaptive temperature stays off for a reproducible overnight baseline.
enable_stability_callback: true
stability_consecutive: 2
entropy_collapse_action: "reduce_lr"
entropy_lr_reduction_factor: 0.5
enable_adaptive_beta: false
enable_adaptive_temperature: false
entropy_target_min: 2.0
temp_bump: 0.15
temp_max: 1.5
temp_bump_cooldown_steps: 3
early_diag_steps: 30

# Infrastructure & Evaluation Checkpointing Settings
output_dir: "./outputs/qwen_4b_2x5090_v4_run"
# Eval + save every quarter of max_steps (250 // 4 = 62 → steps 62/124/186/248).
# Trainer evaluates before save; Hub push attaches eval_results.json and uploads
# as hub path checkpoint-evaluated-{step}.
eval_strategy: "steps"
eval_steps: 62
max_eval_samples: 32
per_device_eval_batch_size: 8
logging_steps: 10
save_strategy: "steps"
save_steps: 62
# Keep locals tiny: Hub push deletes older after success; save_total_limit is a
# safety net if push is slow/fails so disk does not fill with 8× adapters.
save_total_limit: 2
log_completions: false
# Colocated vLLM for GRPO rollouts (same G=16 / 2048 / 250 steps — quality-neutral).
# Historical HF-generate GRPO ~8h on 4k; vLLM targets ~3–5h. Keep util conservative
# so trainer + vLLM coexist on 2×32GB without OOM (do not raise batch size).
use_vllm: true
vllm_gpu_memory_utilization: 0.30
vllm_max_model_len: 4096
# YAML key stays vllm_max_model_len; mapped to TRL's vllm_max_model_length in
# build_grpo_config (old name was silently dropped).
enable_benchmark_probe: false
# Push each evaluated checkpoint to HF Hub after save (token: HF_TOKEN env).
# Subfolders: aziz9788/qwen35-4b-arabic-rlvr-v5/checkpoint-evaluated-62, ...
push_checkpoints_to_hub: true
hub_model_id: "aziz9788/qwen35-4b-arabic-rlvr-v5"
hub_private: true
hub_checkpoint_name_prefix: "checkpoint-evaluated"
delete_local_checkpoint_after_hub_push: true
# Keep only the latest local checkpoint after a successful HF push (disk relief).
hub_keep_local_last_n: 1
torch_compile: false
use_wandb: true
wandb_project: "arabic-reasoning-rlvr-v4"
resume_policy: "fresh"

# Gaussian curriculum uses pass@8 bins on promoted rlvr_v5.
# E2E order is SFT → pass@8/curate/promote → GRPO; sampler attaches only in GRPO
# (ignored by SFT / pass@8). Keep sigma_fraction=0.2 aligned with V3 production.
# ZVP direct_scoring: discard was V4 clean-baseline (with curriculum off), not a
# bug. Safe with multi-GPU + clamped advantages; restores signal on all-wrong /
# all-correct flat groups (more common under hard curriculum bins).
zero_variance_strategy: "direct_scoring"
curriculum_schedule_type: "gaussian"
sigma_fraction: 0.2
enable_crps: false
crps_max_age_steps: 100
crps_max_traces: 256
