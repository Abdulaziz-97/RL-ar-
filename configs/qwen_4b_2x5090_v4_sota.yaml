# GRPO_V4 — High-Capacity Evidence-Backed SOTA Config for 2x NVIDIA RTX 5090 (32GB VRAM per GPU)
# Sources: DAPO (Yu et al., 2025), Dr.GRPO (arXiv:2503.20783), GDPO (NVlabs, arXiv:2601.05242)

model_name: "Qwen/Qwen3.5-4B"
instruction_base_model: "aziz9788/T06__qwen35-mixed-v6-lr1e5"
load_in_4bit: false
bnb_4bit_compute_dtype: "bfloat16"

# High-Capacity LoRA Expansion (r=128, alpha=256) — Maximum Expressive Power
lora_r: 128
lora_alpha: 256
lora_dropout: 0.05
lora_target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"
  - "embed_tokens"
  - "lm_head"

# Dataset: MASTER V4 DATASETS (4,000 SFT + 4,000 RLVR Prompts)
train_data_path: "data/arabic_reasoning_rlvr_v4.jsonl"
eval_data_path: "data/arabic_reasoning_rlvr_eval.jsonl"
coldstart_data_path: "data/arabic_reasoning_coldstart_v4.jsonl"

# GRPO Generation Hyperparameters
num_generations: 16              # 16 rollouts per prompt
max_completion_length: 2048      # 2048 tokens — 0% truncation cutoff
temperature: 1.15
top_p: 0.95
top_k: 40
stop_strings: ["</answer>"]

# ── PROVEN V3 BATCH MATH (2 Prompts per GPU) ───────────────────────────
per_device_train_batch_size: 2   # 2 prompts / GPU
gradient_accumulation_steps: 8   # 8 accumulation steps (32 global batch)
num_train_epochs: 2
max_steps: 250                   # 250 steps (4,000 prompts * 2 epochs / 32 batch = 250 steps)

learning_rate: 3.0e-6
ddp_find_unused_parameters: false
max_grad_norm: 1.0
warmup_ratio: 0.1
lr_scheduler_type: "cosine"
optim: "adamw_torch"
seed: 42

# Memory Optimization Flags
gradient_checkpointing: true
bf16: true
fp16: false
attn_implementation: "sdpa"

# GRPO Loss — DAPO Recipe
loss_type: "dr_grpo"
scale_rewards: "batch"
beta: 0.0                        # Remove KL penalty (DAPO recipe)
epsilon: 0.2
epsilon_high: 0.28
importance_sampling_level: "token"
mask_truncated_completions: true

# Multi-Reward Weights: [correctness, format, language, answer_leak, structural_leak, length]
reward_weights: [0.85, 0.15, 0.0, 0.5, 0.3, 0.0]
gdpo_decoupled_normalization: true

# Entropy Collapse Prevention
entropy_coef: 0.05
use_adaptive_entropy: true
entropy_target: 3.0
entropy_coef_delta: 0.01

# Stability Callbacks
enable_stability_callback: true
stability_consecutive: 2
entropy_collapse_action: "reduce_lr"
entropy_lr_reduction_factor: 0.5
enable_adaptive_temperature: true
entropy_target_min: 2.0
temp_bump: 0.15
temp_max: 1.5
temp_bump_cooldown_steps: 3
early_diag_steps: 30

# Infrastructure & Evaluation Checkpointing Settings
output_dir: "./outputs/qwen_4b_2x5090_v4_run"
eval_strategy: "steps"
eval_steps: 50
per_device_eval_batch_size: 8
logging_steps: 10
save_strategy: "steps"
save_steps: 50
save_total_limit: 5
log_completions: true
use_vllm: true
vllm_gpu_memory_utilization: 0.30
torch_compile: true
use_wandb: true
wandb_project: "arabic-reasoning-rlvr-v4"

zero_variance_strategy: "direct_scoring"
curriculum_schedule_type: "gaussian"
sigma_fraction: 0.2
enable_crps: false
crps_max_age_steps: 100
crps_max_traces: 256
