# Canonical Recipe for Vast.ai NVIDIA RTX 6000 Ada (48GB VRAM)
# Model: Qwen3.5-4B (1,707 SFT + 1,707 RLVR samples)

model_name: "Qwen/Qwen3.5-4B"
load_in_4bit: false
bnb_4bit_compute_dtype: "bfloat16"

# LoRA Configuration
lora_r: 128
lora_alpha: 256
lora_dropout: 0.05

# Dataset Paths (1,707 Verified Samples)
train_data_path: "data/arabic_reasoning_rlvr_train.jsonl"
eval_data_path: "data/arabic_reasoning_rlvr_eval.jsonl"
coldstart_data_path: "data/arabic_reasoning_coldstart_train.jsonl"

# GRPO Generation Hyperparameters
num_generations: 8              # 8 rollouts per prompt (Safe for 48GB VRAM)
max_completion_length: 768       # Arabic CoT reasoning — 768 tokens required (Unlocked 75.20% AraIFEval)
temperature: 1.15                # Calibrated temperature (prevents arithmetic calculation slips)
top_p: 0.95
top_k: 40
stop_strings: ["</answer>"]

# Distributed Training Hyperparameters (RTX 6000 Ada 48GB)
learning_rate: 5.0e-6
num_train_epochs: 1
per_device_train_batch_size: 2   # 2 prompts × 8 rollouts = 16 completions per micro-step (26GB VRAM)
gradient_accumulation_steps: 4   # 4 micro-steps = 64 completions total per gradient update
max_grad_norm: 1.0
warmup_ratio: 0.1
lr_scheduler_type: "cosine"
optim: "adamw_torch"
seed: 42

# Loss & Stability Controls
loss_type: "dr_grpo"
scale_rewards: "batch"
beta: 0.04
epsilon: 0.2
epsilon_high: 0.28
importance_sampling_level: "token"
mask_truncated_completions: true

# Multi-Reward Weights: [correctness, format, language, answer_leak, structural_leak, length]
# Length penalty set to 0.0 — allows full 768-token responses for multi-paragraph IFEval tasks
reward_weights: [0.6, 0.3, 0.1, 0.5, 0.3, 0.0]
# GDPO: Normalize each reward independently before weighted sum (NVlabs arXiv:2601.05242)
gdpo_decoupled_normalization: true

# Adaptive Entropy Regularization (prevents entropy collapse — TRL native)
# When entropy drops below entropy_target, TRL auto-increases the entropy bonus coefficient
entropy_coef: 0.01
use_adaptive_entropy: true
entropy_target: 2.0
entropy_coef_delta: 0.005

# Adaptive Controls & Stability
enable_stability_callback: true
stability_consecutive: 2
entropy_collapse_action: "warn"
entropy_lr_reduction_factor: 0.5
enable_adaptive_temperature: true
entropy_target_min: 1.5
temp_bump: 0.15
temp_max: 1.5
temp_bump_cooldown_steps: 3
early_diag_steps: 30

# Infrastructure Settings
output_dir: "./outputs/qwen_4b_rtx6000ada_run"
logging_steps: 10
save_steps: 100
bf16: true
fp16: false
gradient_checkpointing: true
# Live Completion Printing & Telemetry (Saved to output dir file)
log_completions: false
num_completions_to_print: 0
use_transformers_continuous_batching: false
use_vllm: false
vllm_gpu_memory_utilization: 0.35
vllm_max_model_len: 4096
attn_implementation: "flash_attention_2"
use_wandb: false
wandb_project: "arabic-reasoning-rlvr"

zero_variance_strategy: "direct_scoring"
curriculum_schedule_type: "gaussian"
sigma_fraction: 0.2
enable_crps: true
crps_max_age_steps: 100
crps_max_traces: 256
