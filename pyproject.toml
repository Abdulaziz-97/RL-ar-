[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-rlvr-pipeline"
version = "0.1.0"
description = "Arabic Reasoning RLVR pipeline (SFT + GRPO/QLoRA) — team distribution pack"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate==1.14.0",
    "bitsandbytes==0.49.2",
    "datasets==5.0.0",
    "huggingface_hub==1.22.0",
    "jsonschema==4.26.0",
    "numpy==2.4.4",
    "pandas==3.0.3",
    "peft==0.19.1",
    "protobuf==7.35.1",
    "PyYAML==6.0.3",
    "safetensors==0.8.0",
    "sentencepiece>=0.2.0",
    "tokenizers==0.22.2",
    "transformers==5.13.0",
    "trl==1.7.1",
    "tqdm==4.68.4",
    "rich==15.0.0",
    "typer==0.26.8",
    "wandb==0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rlvr_contracts = ["schemas/*.json"]
