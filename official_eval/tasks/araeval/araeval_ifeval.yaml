task: araeval_ifeval
dataset_path: humain-ai/AraIFEval
dataset_name: default
dataset_kwargs:
  revision: 49d32ae083091fc1fbfa22c300c209ebe4740372
test_split: train
process_docs: !function utils.process_araifeval
output_type: generate_until
doc_to_text: prompt
doc_to_target: 0
generation_kwargs:
  until: []
  do_sample: false
  temperature: 0.0
  max_gen_toks: 1280
process_results: !function utils.process_ifeval_results
metric_list:
  - metric: prompt_level_strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: inst_level_strict_acc
    aggregation: !function utils.aggregate_instruction_accuracy
    higher_is_better: true
  - metric: prompt_level_loose_acc
    aggregation: mean
    higher_is_better: true
  - metric: inst_level_loose_acc
    aggregation: !function utils.aggregate_instruction_accuracy
    higher_is_better: true
metadata:
  version: 1.0
